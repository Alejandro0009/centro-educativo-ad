<main class="relative flex min-h-screen items-center justify-center overflow-hidden bg-[#080808] px-5 py-12 text-white sm:px-8">
  <div
    class="pointer-events-none absolute -left-40 top-10 h-96 w-96 rounded-full bg-[#d4af37]/[0.08] blur-[150px]"
    aria-hidden="true"
  ></div>

  <div
    class="pointer-events-none absolute -right-40 bottom-0 h-96 w-96 rounded-full bg-white/[0.025] blur-[150px]"
    aria-hidden="true"
  ></div>

  <section class="relative w-full max-w-md rounded-[2rem] border border-white/10 bg-[#111]/95 p-6 shadow-2xl sm:p-9">
    <a
      routerLink="/"
      class="text-xs text-white/45 transition hover:text-[#d4af37]"
    >
      ← Volver al sitio
    </a>

    <div class="mt-10">
      <span class="inline-flex items-center gap-2 rounded-full border border-[#d4af37]/25 bg-[#d4af37]/[0.06] px-3 py-2 text-[9px] font-semibold uppercase tracking-[0.2em] text-[#d4af37]">
        Centro Educativo AD
      </span>

      <h1 class="mt-6 text-4xl font-semibold tracking-[-0.06em] sm:text-5xl">
        Acceso de
        <span class="text-[#d4af37]">alumnos</span>
      </h1>

      <p class="mt-4 text-sm leading-6 text-white/50">
        Inicia sesión para entrar a tu espacio de aprendizaje.
      </p>
    </div>

    <form class="mt-8 space-y-5" (ngSubmit)="login()">
      <div>
        <label for="username" class="mb-2 block text-xs font-medium text-white/70">
          Usuario
        </label>

        <input
          id="username"
          name="username"
          type="text"
          [(ngModel)]="username"
          autocomplete="username"
          required
          placeholder="Escribe tu usuario"
          class="min-h-12 w-full rounded-xl border border-white/10 bg-black/30 px-4 text-sm text-white outline-none transition placeholder:text-white/25 focus:border-[#d4af37]/60"
        />
      </div>

      <div>
        <label for="password" class="mb-2 block text-xs font-medium text-white/70">
          Contraseña
        </label>

        <div class="flex min-h-12 overflow-hidden rounded-xl border border-white/10 bg-black/30 transition focus-within:border-[#d4af37]/60">
          <input
            id="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            autocomplete="current-password"
            required
            placeholder="Escribe tu contraseña"
            class="min-w-0 flex-1 bg-transparent px-4 text-sm text-white outline-none placeholder:text-white/25"
          />

          <button
            type="button"
            (click)="showPassword = !showPassword"
            class="px-4 text-xs text-white/45 transition hover:text-[#d4af37]"
          >
            {{ showPassword ? 'Ocultar' : 'Ver' }}
          </button>
        </div>
      </div>

      <p
        [hidden]="!errorMessage"
        role="alert"
        class="rounded-lg border border-red-400/20 bg-red-400/[0.06] px-4 py-3 text-sm text-red-200"
      >
        {{ errorMessage }}
      </p>

      <button
        type="submit"
        class="inline-flex min-h-12 w-full items-center justify-center gap-3 rounded-full bg-[#d4af37] px-5 text-sm font-semibold text-black transition hover:bg-[#e8c960]"
      >
        Iniciar sesión
        <span aria-hidden="true">↗</span>
      </button>
    </form>

    <p class="mt-6 text-center text-xs leading-5 text-white/35">
      ¿No tienes tus datos de acceso? Contacta al Centro Educativo AD.
    </p>
  </section>
</main>
